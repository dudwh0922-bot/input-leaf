name: Build APK

on:
  push:
    branches:
      - korean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Generate signing keystore
        run: keytool -genkeypair -keystore app/input-leaf.jks -storepass inputleaf123 -keypass inputleaf123 -alias input-leaf -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Input Leaf Korean"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: input-leaf-apk
          path: app/build/dist/debug/input-leaf_*_universal.apk
